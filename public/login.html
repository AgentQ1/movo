<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - ADCS</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center">
    <div class="max-w-md w-full bg-white rounded-lg shadow-md p-8">
        <h1 class="text-2xl font-bold mb-6 text-center">Welcome to ADCS</h1>
        
        <div id="loginForm" class="space-y-4">
            <h2 class="text-xl font-semibold">Login</h2>
            <input type="email" id="loginEmail" placeholder="Email" 
                   class="w-full px-4 py-2 border border-gray-300 rounded">
            <input type="password" id="loginPassword" placeholder="Password" 
                   class="w-full px-4 py-2 border border-gray-300 rounded">
            <button onclick="login()" 
                    class="w-full bg-blue-500 text-white px-4 py-2 rounded hover:bg-blue-600">
                Login
            </button>
            <p class="text-center text-gray-600">
                Don't have an account? <a href="#" onclick="showSignup()" class="text-blue-500">Sign up</a>
            </p>
        </div>

        <div id="signupForm" class="space-y-4 hidden">
            <h2 class="text-xl font-semibold">Sign Up</h2>
            <input type="text" id="signupUsername" placeholder="Username" 
                   class="w-full px-4 py-2 border border-gray-300 rounded">
            <input type="email" id="signupEmail" placeholder="Email" 
                   class="w-full px-4 py-2 border border-gray-300 rounded">
            <input type="password" id="signupPassword" placeholder="Password" 
                   class="w-full px-4 py-2 border border-gray-300 rounded">
            <button onclick="signup()" 
                    class="w-full bg-green-500 text-white px-4 py-2 rounded hover:bg-green-600">
                Sign Up
            </button>
            <p class="text-center text-gray-600">
                Already have an account? <a href="#" onclick="showLogin()" class="text-blue-500">Login</a>
            </p>
        </div>

        <div id="message" class="mt-4 text-center"></div>
    </div>

    <script>
        const API_BASE = window.location.origin;

        function showSignup() {
            document.getElementById('loginForm').classList.add('hidden');
            document.getElementById('signupForm').classList.remove('hidden');
            document.getElementById('message').textContent = '';
        }

        function showLogin() {
            document.getElementById('signupForm').classList.add('hidden');
            document.getElementById('loginForm').classList.remove('hidden');
            document.getElementById('message').textContent = '';
        }

        async function login() {
            const email = document.getElementById('loginEmail').value;
            const password = document.getElementById('loginPassword').value;

            if (!email || !password) {
                showMessage('Please enter email and password', 'error');
                return;
            }

            try {
                const response = await fetch(`${API_BASE}/api/auth/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });

                const data = await response.json();

                if (response.ok) {
                    localStorage.setItem('sessionId', data.sessionId);
                    localStorage.setItem('userId', data.userId);
                    localStorage.setItem('username', data.username);
                    showMessage('Login successful! Redirecting...', 'success');
                    setTimeout(() => window.location.href = '/index.html', 1000);
                } else {
                    showMessage(data.error || 'Login failed', 'error');
                }
            } catch (error) {
                showMessage('Error: ' + error.message, 'error');
            }
        }

        async function signup() {
            const username = document.getElementById('signupUsername').value;
            const email = document.getElementById('signupEmail').value;
            const password = document.getElementById('signupPassword').value;

            if (!username || !email || !password) {
                showMessage('Please fill in all fields', 'error');
                return;
            }

            try {
                const response = await fetch(`${API_BASE}/api/auth/signup`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, email, password })
                });

                const data = await response.json();

                if (response.ok) {
                    localStorage.setItem('sessionId', data.sessionId);
                    localStorage.setItem('userId', data.userId);
                    localStorage.setItem('username', data.username);
                    showMessage('Signup successful! Redirecting...', 'success');
                    setTimeout(() => window.location.href = '/index.html', 1000);
                } else {
                    showMessage(data.error || 'Signup failed', 'error');
                }
            } catch (error) {
                showMessage('Error: ' + error.message, 'error');
            }
        }

        function showMessage(msg, type) {
            const messageDiv = document.getElementById('message');
            messageDiv.textContent = msg;
            messageDiv.className = 'mt-4 text-center ' + 
                (type === 'error' ? 'text-red-600' : 'text-green-600');
        }

        // Check if already logged in
        if (localStorage.getItem('sessionId')) {
            window.location.href = '/index.html';
        }

        // Allow Enter key to submit
        document.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                if (!document.getElementById('loginForm').classList.contains('hidden')) {
                    login();
                } else {
                    signup();
                }
            }
        });
    </script>
</body>
</html>
