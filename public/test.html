<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ADCS API Test</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen p-8">
    <div class="max-w-4xl mx-auto">
        <h1 class="text-3xl font-bold mb-8 text-gray-800">ADCS API Test Interface</h1>
        
        <!-- API Status -->
        <div class="bg-white rounded-lg shadow-md p-6 mb-6">
            <h2 class="text-xl font-semibold mb-4">API Status</h2>
            <div class="flex items-center gap-4">
                <button onclick="checkHealth()" class="bg-blue-500 text-white px-4 py-2 rounded hover:bg-blue-600">
                    Check Health
                </button>
                <div id="healthStatus" class="text-gray-600"></div>
            </div>
        </div>

        <!-- Create Contact -->
        <div class="bg-white rounded-lg shadow-md p-6 mb-6">
            <h2 class="text-xl font-semibold mb-4">Create Contact</h2>
            <div class="space-y-4">
                <input type="text" id="contactName" placeholder="Name" 
                       class="w-full px-4 py-2 border border-gray-300 rounded">
                <input type="email" id="contactEmail" placeholder="Email" 
                       class="w-full px-4 py-2 border border-gray-300 rounded">
                <button onclick="createContact()" 
                        class="bg-green-500 text-white px-4 py-2 rounded hover:bg-green-600">
                    Create Contact
                </button>
            </div>
        </div>

        <!-- List Contacts -->
        <div class="bg-white rounded-lg shadow-md p-6 mb-6">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-xl font-semibold">Contacts</h2>
                <button onclick="loadContacts()" 
                        class="bg-blue-500 text-white px-4 py-2 rounded hover:bg-blue-600">
                    Refresh
                </button>
            </div>
            <div id="contactsList" class="space-y-2"></div>
        </div>

        <!-- Upload File -->
        <div class="bg-white rounded-lg shadow-md p-6 mb-6">
            <h2 class="text-xl font-semibold mb-4">Upload File</h2>
            <div class="space-y-4">
                <input type="file" id="fileInput" class="w-full">
                <input type="number" id="fileContactId" placeholder="Contact ID (optional)" 
                       class="w-full px-4 py-2 border border-gray-300 rounded">
                <button onclick="uploadFile()" 
                        class="bg-purple-500 text-white px-4 py-2 rounded hover:bg-purple-600">
                    Upload File
                </button>
            </div>
        </div>

        <!-- List Files -->
        <div class="bg-white rounded-lg shadow-md p-6">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-xl font-semibold">Files</h2>
                <button onclick="loadFiles()" 
                        class="bg-blue-500 text-white px-4 py-2 rounded hover:bg-blue-600">
                    Refresh
                </button>
            </div>
            <div id="filesList" class="space-y-2"></div>
        </div>

        <!-- Response Area -->
        <div class="bg-gray-800 text-green-400 rounded-lg shadow-md p-6 mt-6">
            <h2 class="text-xl font-semibold mb-4">API Response</h2>
            <pre id="response" class="text-sm overflow-auto">Ready...</pre>
        </div>
    </div>

    <script>
        const API_URL = 'https://adcs-worker.adcs-api-9482.workers.dev';

        function showResponse(data) {
            document.getElementById('response').textContent = JSON.stringify(data, null, 2);
        }

        async function checkHealth() {
            try {
                const response = await fetch(`${API_URL}/health`);
                const text = await response.text();
                document.getElementById('healthStatus').textContent = `✅ ${text}`;
                document.getElementById('healthStatus').className = 'text-green-600 font-semibold';
                showResponse({ status: text });
            } catch (error) {
                document.getElementById('healthStatus').textContent = `❌ Error: ${error.message}`;
                document.getElementById('healthStatus').className = 'text-red-600 font-semibold';
                showResponse({ error: error.message });
            }
        }

        async function createContact() {
            const name = document.getElementById('contactName').value;
            const email = document.getElementById('contactEmail').value;

            if (!email) {
                alert('Email is required');
                return;
            }

            try {
                const response = await fetch(`${API_URL}/api/contacts`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, email })
                });
                const data = await response.json();
                showResponse(data);
                document.getElementById('contactName').value = '';
                document.getElementById('contactEmail').value = '';
                loadContacts();
            } catch (error) {
                showResponse({ error: error.message });
            }
        }

        async function loadContacts() {
            try {
                const response = await fetch(`${API_URL}/api/contacts`);
                const contacts = await response.json();
                showResponse(contacts);
                
                const listHtml = contacts.length === 0 
                    ? '<p class="text-gray-500">No contacts yet</p>'
                    : contacts.map(c => `
                        <div class="flex justify-between items-center p-3 bg-gray-50 rounded">
                            <div>
                                <strong>${c.name || 'No name'}</strong> - ${c.email}
                                <span class="text-sm text-gray-500 ml-2">ID: ${c.id}</span>
                            </div>
                            <button onclick="deleteContact(${c.id})" 
                                    class="bg-red-500 text-white px-3 py-1 rounded text-sm hover:bg-red-600">
                                Delete
                            </button>
                        </div>
                    `).join('');
                
                document.getElementById('contactsList').innerHTML = listHtml;
            } catch (error) {
                showResponse({ error: error.message });
            }
        }

        async function deleteContact(id) {
            if (!confirm('Are you sure you want to delete this contact?')) return;
            
            try {
                const response = await fetch(`${API_URL}/api/contacts/${id}`, {
                    method: 'DELETE'
                });
                const data = await response.json();
                showResponse(data);
                loadContacts();
            } catch (error) {
                showResponse({ error: error.message });
            }
        }

        async function uploadFile() {
            const fileInput = document.getElementById('fileInput');
            const contactId = document.getElementById('fileContactId').value;
            
            if (!fileInput.files[0]) {
                alert('Please select a file');
                return;
            }

            const formData = new FormData();
            formData.append('file', fileInput.files[0]);
            if (contactId) formData.append('contactId', contactId);

            try {
                const response = await fetch(`${API_URL}/api/files/upload`, {
                    method: 'POST',
                    body: formData
                });
                const data = await response.json();
                showResponse(data);
                fileInput.value = '';
                document.getElementById('fileContactId').value = '';
                loadFiles();
            } catch (error) {
                showResponse({ error: error.message });
            }
        }

        async function loadFiles() {
            try {
                const response = await fetch(`${API_URL}/api/files`);
                const files = await response.json();
                showResponse(files);
                
                const listHtml = files.length === 0 
                    ? '<p class="text-gray-500">No files yet</p>'
                    : files.map(f => `
                        <div class="flex justify-between items-center p-3 bg-gray-50 rounded">
                            <div>
                                <strong>${f.name}</strong>
                                <span class="text-sm text-gray-500 ml-2">${(f.size / 1024).toFixed(2)} KB</span>
                                <span class="text-xs text-gray-400 ml-2">${new Date(f.uploaded_at).toLocaleString()}</span>
                            </div>
                            <a href="${API_URL}/api/files/${f.key}" 
                               class="bg-blue-500 text-white px-3 py-1 rounded text-sm hover:bg-blue-600">
                                Download
                            </a>
                        </div>
                    `).join('');
                
                document.getElementById('filesList').innerHTML = listHtml;
            } catch (error) {
                showResponse({ error: error.message });
            }
        }

        // Load data on page load
        window.onload = () => {
            checkHealth();
            loadContacts();
            loadFiles();
        };
    </script>
</body>
</html>
